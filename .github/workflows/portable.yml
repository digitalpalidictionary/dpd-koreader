name: Portable checks

on:
  push:
    # Tags run these checks through release.yml instead.
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install portable test runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            luajit=2.1.0+openresty20250117-2 \
            lua-busted=2.2.0-1 lua-json=1.3.4-3 python3
      - name: Lua behavior tests
        run: luajit /usr/bin/busted spec
      - name: Lua specs in isolation
        # A spec that passes only after another has loaded a shared module
        # fails here instead of when files are renamed or reordered.
        run: |
          for spec in spec/*_spec.lua; do
            luajit /usr/bin/busted "$spec" > /tmp/spec.log 2>&1 || { cat /tmp/spec.log; echo "FAIL: $spec"; exit 1; }
          done
      - name: Python and reproducible packaging tests
        run: python3 -m unittest discover -s spec -p 'test_*.py'
      - name: Build distributable archives
        run: python3 tools/package.py
